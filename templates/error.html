<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - Mealprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-sm text-center">
        <p class="text-5xl font-bold text-slate-200 mb-4">{{ code }}</p>
        <p class="text-slate-700 mb-6">{{ message }}</p>
        <a href="/" class="bg-slate-800 text-white py-2 px-6 rounded-lg hover:bg-slate-700 font-medium text-sm">
            Back to home
        </a>

</html>
